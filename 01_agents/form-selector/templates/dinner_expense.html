<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>야근 식대 신청서</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<div class="card">
    <h2 class="form-title">야근 식대 신청서</h2>
    <form id="dinnerExpenseForm">
        <div class="form-row">
            <div class="form-group">
                <label for="workDate">야근 일자</label>
                <input type="date" id="workDate" name="workDate" value="{workDate}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="workLocation">근무 장소</label>
                <input type="text" id="workLocation" name="workLocation" value="{workLocation}">
            </div>
            <div class="form-group">
                <label for="overtimeTime">퇴근 시간</label>
                <input type="text" id="overtimeTime" name="overtimeTime" placeholder="예: 밤 10시 30분 또는 22:30" value="{overtimeTime}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="dinnerExpenseAmount">식대 금액</label>
                <input type="number" id="dinnerExpenseAmount" name="dinnerExpenseAmount" value="{dinnerExpenseAmount}">
            </div>
             <div class="form-group">
                <label for="bankAccountForDeposit">입금 요청 계좌</label>
                <input type="text" id="bankAccountForDeposit" name="bankAccountForDeposit" placeholder="예: OO은행 123-456-789012" value="{bankAccountForDeposit}">
            </div>
        </div>
        <div class="form-group">
            <label for="workDetails">주요 업무 내용</label>
            <textarea id="workDetails" name="workDetails" rows="4">{workDetails}</textarea>
        </div>
    </form>
</div>
<script id="approvers-data" type="application/json">{approvers_json}</script>
