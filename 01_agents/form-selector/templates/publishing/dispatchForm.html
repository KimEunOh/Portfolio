<!DOCTYPE html>
<html lang="ko" xml:lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{/soulGod/fragments/headChatbot :: headChatbot}"></th:block>
    <script th:inline="javascript">
        $(function(){
            //datepicker
            fn_setDatePicker('#searchStDt', {
                onShow: function (ct) {
                    this.setOptions({
                        maxDate: $('#searchEdDt').val() ? $('#searchEdDt').val() : false
                    })
                }
            });
            fn_setDatePicker('#searchEdDt', {
                onShow: function (ct) {
                    this.setOptions({
                        minDate: $('#searchStDt').val() ? $('#searchStDt').val() : false
                    })
                }
            });

            // 결재라인 버튼 클릭
            $(document).on('click', '.approval_line .btn_arr', function() {
                $(this).parents('.approval_line').toggleClass('active');
            });
        });
    </script>
</head>
<body>
<div id="wrap">
    <div class="contents">
        <div class="form_area">
            <div class="form_tit">파견 및 출장 보고서</div>
            <div class="approval_line">
                <div class="draft">
                    <div class="tit">
                        <span>기안</span>
                        <span class="date">(2025.07.14)</span>
                    </div>
                    <div class="name">
                        이철수 선임
                        <button type="button" class="btn_arr"></button>
                    </div>
                </div>
                <div class="lines">
                    <ul>
                        <li>
                            <dl>
                                <dt>합의</dt>
                                <dd>
                                    <div class="name">이영희 책임</div>
                                    <button type="button" class="btn">변경</button>
                                </dd>
                            </dl>
                        </li>
                        <li>
                            <dl>
                                <dt>결재</dt>
                                <dd>
                                    <div class="name">김명수 이사</div>
                                    <button type="button" class="btn">변경</button>
                                </dd>
                            </dl>
                        </li>
                        <li>
                            <dl>
                                <dt>참조</dt>
                                <dd>
                                    <div class="name">-</div>
                                    <button type="button" class="btn">추가</button>
                                </dd>
                            </dl>
                        </li>
                    </ul>
                </div>
            </div>
            <form action="">
                <fieldset>
                    <legend>파견 및 출장 보고서</legend>
                    <div class="form">
                        <div class="row">
                            <dl class="col">
                                <dt><label for="searchStDt">기간</label> <span class="badge">총 일수 : 1</span></dt>
                                <dd>
                                    <div class="term_form">
                                        <div class="input">
                                            <label for="searchStDt" class="blind">시작날짜 입력</label>
                                            <input type="text" id="searchStDt" name="startDate" class="datepicker" readonly value="{startDate}">
                                        </div>
                                        <div class="swung">-</div>
                                        <div class="input">
                                            <label for="searchEdDt" class="blind">종료날짜 입력</label>
                                            <input type="text" id="searchEdDt" name="endDate" class="datepicker" readonly value="{endDate}">
                                        </div>
                                    </div>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt><label for="origin">출발지</label></dt>
                                <dd>
                                    <div class="input">
                                        <input type="text" id="origin" name="origin" placeholder="입력하세요." value="{origin}">
                                        <button type="button" class="btn_del" tabindex="-1">
                                            <span class="blind">삭제</span>
                                        </button>
                                    </div>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt><label for="destination">파견지 또는 출장지</label></dt>
                                <dd>
                                    <div class="input">
                                        <input type="text" id="destination" name="destination" placeholder="입력하세요." value="{destination}">
                                        <button type="button" class="btn_del" tabindex="-1">
                                            <span class="blind">삭제</span>
                                        </button>
                                    </div>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt>
                                    <label for="purpose">파견/출장 목적</label>
                                </dt>
                                <dd>
                                    <textarea name="purpose" id="purpose" placeholder="입력하세요.">{purpose}</textarea>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt>
                                    <label for="reportDetails">주요 업무 내용 및 결과(보고사항)</label>
                                </dt>
                                <dd>
                                    <textarea name="reportDetails" id="reportDetails" placeholder="입력하세요.">{reportDetails}</textarea>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt>
                                    <label for="notes">기타 특이사항</label>
                                </dt>
                                <dd>
                                    <textarea name="notes" id="notes" placeholder="입력하세요.">{notes}</textarea>
                                </dd>
                            </dl>
                        </div>
                    </div>
                    <div class="btn_area">
                        <button type="button" class="btn btn_md fill_primary">제출하기</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
</body>
</html>
