<!DOCTYPE html>
<html lang="ko" xml:lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{/soulGod/fragments/headChatbot :: headChatbot}"></th:block>
    <script th:inline="javascript">
        $(function(){
            //datepicker
            fn_setDatePicker('#date');
            fn_setDatePicker('#date2');
            fn_setDatePicker('#date3');

            // 결재라인 버튼 클릭
            $(document).on('click', '.approval_line .btn_arr', function() {
                $(this).parents('.approval_line').toggleClass('active');
            });

            // 상세 내역 버튼 클릭
            $(document).on('click', '.detail_area ul > li .btn_arr', function() {
                $(this).parents('li').toggleClass('active');
            });

        });
    </script>
</head>
<body>
<div id="wrap">
    <div class="contents">
        <div class="form_area">
            <div class="form_tit">개인경비 사용 내역서</div>
            <div class="approval_line">
                <div class="draft">
                    <div class="tit">
                        <span>기안</span>
                        <span class="date">(2025.07.14)</span>
                    </div>
                    <div class="name">
                        이철수 선임
                        <button type="button" class="btn_arr"></button>
                    </div>
                </div>
                <div class="lines">
                    <ul>
                        <li>
                            <dl>
                                <dt>합의</dt>
                                <dd>
                                    <div class="name">이영희 책임</div>
                                    <button type="button" class="btn">변경</button>
                                </dd>
                            </dl>
                        </li>
                        <li>
                            <dl>
                                <dt>결재</dt>
                                <dd>
                                    <div class="name">김명수 이사</div>
                                    <button type="button" class="btn">변경</button>
                                </dd>
                            </dl>
                        </li>

                            <dl>
                                <dt>참조</dt>
                                <dd>
                                    <div class="name">-</div>
                                    <button type="button" class="btn">추가</button>
                                </dd>
                            </dl>
                        </li>
                    </ul>
                </div>
            </div>
            <form action="">
                <fieldset>
                    <legend>개인경비 사용 내역서</legend>
                    <div class="form">
                        <div class="row">
                            <dl class="col">
                                <dt><label for="usageStatus">사용 현황</label></dt>
                                <dd>
                                    <select name="usageStatus" id="usageStatus" data-selected="{usageStatus}">
                                        <option value="">선택하세요</option>
                                        <option value="personal_cash">개인현금</option>
                                        <option value="personal_card">개인카드</option>
                                    </select>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt><label for="expenseReason">지출 사유</label></dt>
                                <dd>
                                    <textarea name="expenseReason" id="expenseReason" placeholder="입력하세요.">{expenseReason}</textarea>
                                </dd>
                            </dl>
                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt>경비 사용 상세 내역 <button type="button" class="btn btn_add"></button></dt>
                                <dd>
                                    <div class="detail_area">
                                        <ul>
                                            <li>
                                                <div class="box">
                                                    <div class="box_head">
                                                        <div class="tit">

                                                            <p>교통비</p>
                                                        </div>
                                                        <div class="data">
                                                            <div class="input inp_sm">
                                                                <input type="text" id="expenseAmount1" name="expenseAmount1" class="comma" placeholder="입력하세요." value="160300">
                                                                <button type="button" class="btn_del" tabindex="-1">
                                                                    <span class="blind">삭제</span>
                                                                </button>
                                                            </div>
                                                            <button type="button" class="btn btn_remove"></button>
                                                        </div>
                                                    </div>
                                                    <div class="box_body">
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseCategory1">분류</label></dt>
                                                                <dd>
                                                                    <select name="expenseCategory1" id="expenseCategory1" class="sel sel_sm">
                                                                        <option value="">선택</option>
                                                                        <option value="traffic">교통비</option>
                                                                        <option value="accommodation">숙박비</option>
                                                                        <option value="meals">식대</option>
                                                                        <option value="entertainment">접대비</option>
                                                                        <option value="education">교육훈련비</option>
                                                                        <option value="supplies">소모품비</option>
                                                                        <option value="other">기타</option>
                                                                    </select>
                                                                </dd>
                                                            </dl>
                                                        </div>
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="date">사용일자</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="date" name="expenseDate1" class="datepicker" readonly>
                                                                    </div>
                                                                </dd>
                                                            </dl>
                                                        </div>
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseDescription1">사용내역</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="expenseDescription1" name="expenseDescription1" placeholder="입력하세요.">
                                                                        <button type="button" class="btn_del" tabindex="-1">
                                                                            <span class="blind">삭제</span>
                                                                        </button>
                                                                    </div>
                                                                </dd>
                                                            </dl>
                                                        </div>
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseNotes1">비고</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="expenseNotes1" name="expenseNotes1" placeholder="입력하세요.">
                                                                        <button type="button" class="btn_del" tabindex="-1">
                                                                            <span class="blind">삭제</span>
                                                                        </button>
                                                                    </div>
                                                                </dd>

                                                        </div>

                                                </div>
                                            </li>
                                            <li>

                                                        <div class="row">

                                                        </div>
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseDescription2">사용내역</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="expenseDescription2" name="expenseDescription2" placeholder="입력하세요.">

                                                            </dl>
                                                        </div>
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseNotes2">비고</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="expenseNotes2" name="expenseNotes2" placeholder="입력하세요.">

                                                                </dd>

                                                    <div class="box_body">
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseCategory3">분류</label></dt>
                                                                <dd>
                                                                    <select name="expenseCategory3" id="expenseCategory3" class="sel sel_sm">
                                                                        <option value="">선택</option>
                                                                        <option value="traffic">교통비</option>
                                                                        <option value="accommodation">숙박비</option>
                                                                        <option value="meals">식대</option>
                                                                        <option value="entertainment">접대비</option>
                                                                        <option value="education">교육훈련비</option>
                                                                        <option value="supplies">소모품비</option>

                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseDescription3">사용내역</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="expenseDescription3" name="expenseDescription3" placeholder="입력하세요.">

                                                                            <span class="blind">삭제</span>

                                                                    </div>
                                                                </dd>
                                                            </dl>
                                                        </div>
                                                        <div class="row">
                                                            <dl class="col">
                                                                <dt><label for="expenseNotes3">비고</label></dt>
                                                                <dd>
                                                                    <div class="input">
                                                                        <input type="text" id="expenseNotes3" name="expenseNotes3" placeholder="입력하세요.">

                        </div>
                        <div class="row">
                            <dl class="col">
                                <dt><label for="totalExpenseAmount">총 금액</label></dt>
                                <dd>
                                    <div class="input">
                                        <input type="text" id="totalExpenseAmount" name="totalExpenseAmount" class="comma" placeholder="입력하세요.">

                                            <span class="blind">삭제</span>

                            </dl>

                    </div>
                    <div class="tip">
                        <p>영수증 별도 제출</p>
                    </div>
                    <div class="btn_area">
                        <button type="button" class="btn btn_md fill_primary">제출하기</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
</body>
</html>
